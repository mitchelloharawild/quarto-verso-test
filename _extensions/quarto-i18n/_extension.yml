title: quarto-i18n
author: quarto-i18n contributors
version: 0.1.0
quarto-required: ">=1.10.0"
# Projects keep their own type (book, website, ...) and add one hook:
#   project:
#     post-render: node _extensions/quarto-i18n/i18n.mjs hook
# `i18n build` adds the tr.lua filter to each language's mirror project.
contributes:
  filters:
    - tr.lua
