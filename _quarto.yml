project:
  type: quarto-i18n            # the extension's project type: a book plus the i18n post-render hook

book:
  title: "Forecasting in Brief"
  subtitle: "A small book that demonstrates quarto-i18n"
  author: "quarto-i18n contributors"
  chapters:
    - index.qmd
    - part: "Foundations"
      chapters:
        - chapters/time-series.qmd
        - chapters/visualising.qmd
    - part: "Methods"
      chapters:
        - chapters/benchmarks.qmd
    - chapters/how-it-works.qmd

bibliography: references.bib

execute:
  freeze: auto

format:
  html:
    theme: cosmo

translate:
  source: en
  targets: [fr, es]
  instructions: >
    Friendly, clear register for students. Use the conventional statistical
    terminology of the target language. Keep R function and package names in English.
  glossary: _glossary.yml
  backend: {provider: external}
  on-stale: source
  review:
    target: 2
    service: http://localhost:8787   # verso-i18n PR service, run locally for testing
    repo: mitchelloharawild/quarto-verso-test
