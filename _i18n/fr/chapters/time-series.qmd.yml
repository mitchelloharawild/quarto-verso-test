    source: |-
      A time series is a sequence of observations of the same quantity, recorded at
      regular intervals. Monthly airline passenger numbers, daily electricity demand
      and quarterly unemployment rates are all time series.
    text: Une série temporelle est une suite d’observations d’une même grandeur, relevées à intervalles réguliers. Le nombre mensuel de passagers aériens, la demande quotidienne d’électricité et le taux de chômage trimestriel sont tous des séries temporelles.
    terms: { time-series: 61b97754 }
    origin: { by: llm, model: claude-code/claude-opus-5-5, date: 2026-11-09 }
    reviews:
      - { by: gh:bob, date: 2026-11-09 }
