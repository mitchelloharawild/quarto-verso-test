    source-hash: d26a51c3
    source: |-
      Unlike most data sets, the order of the observations matters. Each value is
      related to the values before it, and a forecast uses that relationship to say
      something about the future.
    text: Contrairement à la plupart des jeux de données, l’ordre des observations compte. Chaque valeur est liée aux valeurs qui la précèdent, et une prévision s’appuie sur cette relation pour dire quelque chose de l’avenir.
