    source-hash: 8905dd28
    source: |-
      The **naive** method uses the last observation as the forecast for every
      future period. The **seasonal naive** method instead uses the value from the
      same season of the last year, so a forecast for next July is this July's value.
    text: "La méthode **naïve** utilise la dernière observation comme prévision pour toutes les périodes futures. La méthode **naïve saisonnière** utilise plutôt la valeur de la même saison de l’année précédente : la prévision pour juillet prochain est la valeur de juillet dernier."
    terms: { forecast: dd8922d9 }
