    source-hash: 8cd88e36
    source: |-
      A single number hides how uncertain a forecast is. A prediction interval gives
      a range in which the future value is expected to lie with a stated
      probability, such as 80% or 95%. Intervals usually become wider as the
      forecast horizon increases.
    text: Un seul nombre masque l’incertitude d’une prévision. Un intervalle de prédiction donne une plage dans laquelle la valeur future devrait se trouver avec une probabilité donnée, par exemple 80 % ou 95 %. Les intervalles s’élargissent généralement à mesure que l’horizon de prévision augmente.
