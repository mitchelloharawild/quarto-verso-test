  - id: u055103
    kind: block
    section: sec-translating
    source-hash: "82828e03"
    source: |-
      Running `i18n translate` collects the units that are new or whose English text
      has changed. A translator fills them in, and the tool checks every result
      before it is accepted. Inline code, links, citations, cross-references and
      shortcodes must come back unchanged, and translated code must parse with R's
      own parser.
    text: La commande `i18n translate` rassemble les unités nouvelles ou dont le texte anglais a changé. Un traducteur les complète, et l’outil vérifie chaque résultat avant de l’accepter. Le code en ligne, les liens, les citations, les renvois et les shortcodes doivent revenir inchangés, et le code traduit doit être analysable par l’analyseur de R lui-même.
    origin: { by: llm, model: claude-code/claude-opus-5-5, date: 2026-11-09 }
    reviews: []
  - id: uf17df6
