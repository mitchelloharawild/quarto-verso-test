    section: sec-one-source
    source-hash: c57c52fc
    source: |-
      The author edits only the English `.qmd` files and `_quarto.yml`. Each
      translated language lives in a set of translation files under `_i18n/`, one
      file per chapter. Every paragraph, caption and code comment is a separate unit
      with its own source text, translation and list of reviewers.
    text: L’auteur ne modifie que les fichiers `.qmd` en anglais et `_quarto.yml`. Chaque langue traduite vit dans un ensemble de fichiers de traduction sous `_i18n/`, un fichier par chapitre. Chaque paragraphe, légende et commentaire de code est une unité distincte, avec son propre texte source, sa traduction et sa liste de relecteurs.
    origin: { by: llm, model: claude-code/claude-opus-5-5, date: 2026-11-09 }
    reviews: []
