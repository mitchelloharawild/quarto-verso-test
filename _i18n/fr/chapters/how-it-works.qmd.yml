    source: Keeping translations honest
    text: Des traductions honnêtes
    origin: { by: llm, model: claude-code/claude-opus-5-5, date: 2026-11-09 }
    reviews: []
  - id: u2b42cb
    kind: block
    section: sec-honest
    source-hash: 0a231a6e
    source: |-
      When a paragraph changes in English, its translation becomes *stale*. Readers
      then see the English paragraph, marked as such, until the unit is translated
      again. A translation is never silently wrong.
    text: Quand un paragraphe change en anglais, sa traduction devient *périmée*. Les lecteurs voient alors le paragraphe anglais, signalé comme tel, jusqu’à ce que l’unité soit retraduite. Une traduction n’est jamais fausse en silence.
    origin: { by: llm, model: claude-code/claude-opus-5-5, date: 2026-11-09 }
    reviews: []
  - id: u869eba
    kind: block
    section: sec-honest
    source-hash: 630a3846
    source: |-
      In code cells, only comments and display strings such as plot titles are
      translated. Variable names and data never change, so every language runs the
      same analysis. If a translated cell fails, the build uses the English cell.
    text: Dans les cellules de code, seuls les commentaires et les chaînes affichées, comme les titres de graphiques, sont traduits. Les noms de variables et les données ne changent jamais, si bien que chaque langue exécute la même analyse. Si une cellule traduite échoue, la compilation utilise la cellule anglaise.
    origin: { by: llm, model: claude-code/claude-opus-5-5, date: 2026-11-09 }
    reviews: []
