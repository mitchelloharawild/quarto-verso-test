    source: |-
      Choose **Review this page** in the notice to turn on reviewer mode. Each
      paragraph is marked by the number of people who have reviewed it. Select a
      paragraph to see the English source, then approve the translation or suggest
      a better one. Your changes are collected and submitted together as a pull
      request.
    text: Choisissez **Relire cette page** dans l’avis pour activer le mode relecture. Chaque paragraphe est marqué selon le nombre de personnes qui l’ont relu. Sélectionnez un paragraphe pour voir la source anglaise, puis approuvez la traduction ou proposez-en une meilleure. Vos modifications sont regroupées et soumises ensemble sous forme de pull request.
    origin: { by: llm, model: claude-code/claude-opus-5-5, date: 2026-11-09 }
