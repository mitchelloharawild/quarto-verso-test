    source: |-
      A time series is a sequence of observations of the same quantity, recorded at
      regular intervals. Monthly airline passenger numbers, daily electricity demand
      and quarterly unemployment rates are all time series.
    text: Una serie temporal es una sucesión de observaciones de una misma magnitud, registradas a intervalos regulares. El número mensual de pasajeros aéreos, la demanda diaria de electricidad y la tasa de desempleo trimestral son series temporales.
    terms: { time-series: dcdcebe7 }
